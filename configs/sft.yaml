# SFT 监督微调配置（全量微调）
model:
  vocab_size: 8192
  hidden_size: 384
  num_layers: 8
  num_heads: 8
  ffn_size: 1024
  max_seq_len: 512
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  tie_embeddings: true
  use_lora: false
  lora:
    rank: 8
    alpha: 16.0
    dropout: 0.05
    targets: [q, k, v, o, gate, up, down]
    merge: false
data:
  tokenizer_path: data/tokenizer/tokenizer.json
  sft_path: data/datasets/sft_train.jsonl
  seq_len: 512
  batch_size: 8
  pack: true               # 多条指令样本打包进同一序列
  num_workers: 0
  max_samples: null
train:
  steps: 3000
  epochs: 3
  grad_accum: 4
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  log_every: 50
  eval_every: 500
  save_every: 1000
  out_dir: checkpoints/sft
  resume: null
  mask_prompt_loss: true   # 只对回答段计算损失（prompt 段掩码）
  init_from: checkpoints/pretrain/base.pt   # 从预训练权重初始化
