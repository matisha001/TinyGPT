# LoRA 低秩微调配置（在预训练/全量基座上）
model:
  vocab_size: 8192
  hidden_size: 256
  num_layers: 6
  num_heads: 4
  ffn_size: 768
  max_seq_len: 256
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  tie_embeddings: true
  use_lora: true           # 关键开关：全量训练 ↔ LoRA 并存
  lora:
    rank: 8
    alpha: 16.0
    dropout: 0.05
    targets: [q, k, v, o, gate, up, down]   # 全 7 类投影
    merge: false           # true：训练后合并进基座权重并另存
data:
  tokenizer_path: data/tokenizer/tokenizer.json
  sft_path: data/datasets/sft_train.jsonl
  seq_len: 256
  batch_size: 8
  pack: true
  num_workers: 0
  max_samples: null
train:
  steps: 600
  epochs: 3
  grad_accum: 4
  lr: 3.0e-4              # LoRA 常用稍大学习率
  min_lr: 3.0e-5
  warmup_steps: 50
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  log_every: 50
  eval_every: 200
  save_every: 400
  out_dir: checkpoints/lora_sft
  resume: null
  mask_prompt_loss: true
  init_from: checkpoints/pretrain/base.pt   # 冻结基座，仅训练 adapter
